name: Bandito
options:
  bundleIdPrefix: dev.bandito
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  BanditoKit:
    path: BanditoKit
  # The app's own updates (Sparkle 2). Only the app target links it; BanditoKit and BanditoUI stay Sparkle-free.
  # Pinned to the exact stable release; bump it with its SHA-256 check (see docs/ARCHITECTURE.md#mac-app-updates).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
targets:
  Bandito:
    type: application
    platform: macOS
    sources:
      - Bandito
      # Installs the server-side script into the app bundle (SSHInstaller reads it as install.sh).
      - path: ../../scripts/install.sh
        buildPhase: resources
      # The "What's new" notes (release-notes/<version>.json), read at run time with no network; see ReleaseNotesLibrary.
      - path: ../../release-notes
        type: folder
        buildPhase: resources
    dependencies:
      - package: BanditoKit
        product: BanditoKit
      - package: BanditoKit
        product: BanditoDesign
      - package: BanditoKit
        product: BanditoUI
      - package: Sparkle
        product: Sparkle
    postBuildScripts:
      # Builds the bandito daemon and puts it into Contents/Helpers/bandito, signed with the app's identity.
      # Helpers, not MacOS: on the default case-insensitive APFS, MacOS/bandito would collide with the app's Bandito.
      - name: Build and bundle the bandito daemon
        basedOnDependencyAnalysis: false
        script: |
          set -eu
          # The perf build (scripts/perf-build.sh) runs only the smoothness check: it has no daemon to bundle.
          if [ "${BANDITO_SKIP_DAEMON:-}" = "1" ]; then exit 0; fi
          # Xcode's script PATH has no cargo from rustup or Homebrew.
          export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
          if ! command -v cargo >/dev/null 2>&1; then
            echo "error: cargo not found. Install Rust (https://rustup.rs) so the bandito daemon can be built." >&2
            exit 1
          fi
          target="${CARGO_TARGET_DIR:-$HOME/.cache/bandito-target-app}"
          helpers="$BUILT_PRODUCTS_DIR/$CONTENTS_FOLDER_PATH/Helpers"
          mkdir -p "$helpers"
          # A universal app (ARCHS has arm64 and x86_64, as release-app.sh builds it) gets one daemon for each
          # architecture, joined by lipo. A one-architecture build (Debug) builds only the host's, as before.
          universal=0
          case " $ARCHS " in
            *" arm64 "*) case " $ARCHS " in *" x86_64 "*) universal=1 ;; esac ;;
          esac
          if [ "$universal" = 1 ]; then
            command -v rustup >/dev/null 2>&1 || { echo "error: rustup not found: the universal daemon needs it for the x86_64 target" >&2; exit 1; }
            for triple in aarch64-apple-darwin x86_64-apple-darwin; do
              rustup target list --installed | grep -qx "$triple" || {
                echo "error: the Rust target $triple is not installed. Run: rustup target add $triple" >&2
                exit 1
              }
            done
            for triple in aarch64-apple-darwin x86_64-apple-darwin; do
              (cd "$SRCROOT/../../daemon" && CARGO_TARGET_DIR="$target" cargo build --release --locked -p bandito --target "$triple")
            done
            lipo -create -output "$helpers/bandito" \
              "$target/aarch64-apple-darwin/release/bandito" "$target/x86_64-apple-darwin/release/bandito"
          else
            (cd "$SRCROOT/../../daemon" && CARGO_TARGET_DIR="$target" cargo build --release --locked -p bandito)
            cp -f "$target/release/bandito" "$helpers/bandito"
          fi
          # Ad-hoc ("-", Debug and CI) needs no timestamp server; a real identity (Developer ID) needs one.
          identity="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          if [ "$identity" = "-" ]; then timestamp="--timestamp=none"; else timestamp="--timestamp"; fi
          codesign --force --options runtime $timestamp --sign "$identity" "$helpers/bandito"
    # The hardened runtime needs a declared entitlement for the microphone (dictation). The release script re-signs
    # with the entitlements of the built app, so this one survives notarization.
    entitlements:
      path: Config/Bandito.entitlements
      properties:
        com.apple.security.device.audio-input: true
    # Merged into the generated Info.plist (GENERATE_INFOPLIST_FILE stays YES).
    info:
      path: Config/Info.plist
      properties:
        # Versions come from the build settings below (release-app.sh sets them).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Where Sparkle looks for the appcast; the site serves it (platform repo, public/appcast.xml).
        SUFeedURL: https://bandito.dev/appcast.xml
        # EdDSA public key. The private key lives in the login Keychain of the release Mac (generate_keys); never commit it.
        SUPublicEDKey: UVUKIE5uztSbd3fpqdSPbNklkBuwXYC65+cRXRCqjLY=
        SUEnableAutomaticChecks: true
        # The strings live in BanditoL10n's bundle; macOS picks a framework's language from the languages the
        # app declares, so the app lists every language it ships (otherwise it always runs in English).
        CFBundleLocalizations: [en, ru, ja, zh-Hans, ko, es, pt-BR, de, fr]
        CFBundleAllowMixedLocalizations: true
        # Permission prompts for dictation (the composer's microphone, ⌥⌘D). Translations: Resources/<lang>.lproj/InfoPlist.strings.
        NSMicrophoneUsageDescription: Bandito uses the microphone only while you dictate a message. Speech is recognised on this Mac and never sent over the network.
        NSSpeechRecognitionUsageDescription: Bandito turns your dictated words into text on this Mac. Recognition runs on the device; audio is not sent anywhere.
        # `bandito://oauth/callback` brings the owner back from the browser after a service's sign-in
        # (docs/ARCHITECTURE.md#integrations). The app handles it with onOpenURL.
        CFBundleURLTypes:
          - CFBundleURLName: dev.bandito.oauth
            CFBundleURLSchemes: [bandito]
    settings:
      configs:
        # Debug builds are a separate app: their own defaults, Keychain items (KeychainNamespace) and process,
        # so testing never touches the installed Bandito.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: dev.bandito.mac.debug
      base:
        # The script above reads files outside the target and writes into the product; the sandbox would block it.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_NAME: Bandito
        PRODUCT_BUNDLE_IDENTIFIER: dev.bandito.mac
        MARKETING_VERSION: 0.1.14
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 270
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bandito
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "FSL-1.1-ALv2"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
