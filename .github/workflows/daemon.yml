name: daemon

on:
  pull_request:
    paths: ["daemon/**", ".github/workflows/daemon.yml"]
  push:
    # main, release branches and the branches agents work on: a pushed branch is tested in the cloud, so a change is
    # checked in full without building it on a laptop.
    branches: [main, "release/**", "wt*/**"]
    paths: ["daemon/**", ".github/workflows/daemon.yml"]
  # macOS-specific code (the agents' sandbox, "This Mac") runs every night and on main; PRs test on Linux,
  # where runners are plentiful, and locally on a Mac through .claude/verify.sh before they are sent.
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  # Called by ci.yml, which runs this only when the daemon part of a change (or a workflow) changed.
  workflow_call:

# A newer push to the same PR or branch cancels the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
