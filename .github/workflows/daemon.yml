name: daemon

on:
  # Runs only through ci.yml (one entry point for PRs and pushes, so nothing runs twice).
  # macOS-specific code (the agents' sandbox, "This Mac") also runs every night.
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:
  workflow_call:

# A newer push to the same PR or branch cancels the run for the older one.
concurrency:
  group: daemon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || '["ubuntu-latest","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
