name: i18n

on:
  pull_request:
    paths: ["i18n/**", "apps/mac/BanditoKit/Sources/BanditoL10n/**"]
  push:
    branches: [main]
    paths: ["i18n/**", "apps/mac/BanditoKit/Sources/BanditoL10n/**"]

# A newer push to the same PR or branch cancels the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate strings and generated files
        run: python3 i18n/build.py --check
