name: i18n

on:
  # Runs only through ci.yml (one entry point for PRs and pushes, so nothing runs twice).
  workflow_call:

# A newer push to the same PR or branch cancels the run for the older one.
concurrency:
  group: i18n-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate strings and generated files
        run: python3 i18n/build.py --check
