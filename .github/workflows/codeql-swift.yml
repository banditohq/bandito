name: codeql-swift

# Swift analysis needs a Mac runner and takes the longest, so it runs on main and weekly instead of on every
# PR (the default setup still analyses Rust, Python and Actions on every PR).
on:
  push:
    branches: [main]
    paths: ["apps/**"]
  schedule:
    - cron: "0 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v3
        with:
          languages: swift
          build-mode: autobuild
      - uses: github/codeql-action/autobuild@v3
        with:
          working-directory: apps/mac/BanditoKit
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
