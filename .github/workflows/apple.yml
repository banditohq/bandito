name: apple

on:
  # A PR that changes only the daemon does not rebuild the app (daemon.yml tests it); main still does.
  pull_request:
    paths: ["apps/**", "i18n/**", "brand/tokens/**", "guide/**", "scripts/check_guide.py", ".github/workflows/apple.yml"]
  push:
    branches: [main]
    paths: ["apps/**", "daemon/**", "i18n/**", "brand/tokens/**", "guide/**", "scripts/check_guide.py", ".github/workflows/apple.yml"]

# A newer push to the same PR or branch cancels the run for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build-macos
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Guide covers every screen, setting and command
        run: python3 scripts/check_guide.py

      - name: Select the newest Xcode
        run: |
          xcode="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi

      - name: Xcode version
        run: xcodebuild -version

      - uses: actions/cache@v4
        with:
          path: apps/mac/BanditoKit/.build
          key: swiftpm-${{ runner.os }}-${{ hashFiles('apps/mac/BanditoKit/Package.resolved', 'apps/mac/BanditoKit/Package.swift') }}
          restore-keys: |
            swiftpm-${{ runner.os }}-

      - name: Test BanditoKit
        working-directory: apps/mac/BanditoKit
        run: swift test

      - name: Install Rust (the app bundles the bandito daemon)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (daemon)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Cache Xcode build products
        uses: actions/cache@v4
        with:
          path: ~/.cache/bandito-xcode
          key: xcode-${{ runner.os }}-${{ hashFiles('apps/mac/project.yml', 'apps/mac/BanditoKit/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            xcode-${{ runner.os }}-${{ hashFiles('apps/mac/project.yml', 'apps/mac/BanditoKit/Package.resolved') }}-
            xcode-${{ runner.os }}-

      - name: Build the Mac app (unsigned)
        # build.sh builds the daemon through the app's build phase; CARGO_TARGET_DIR puts it where the cache looks.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/daemon/target
        run: apps/mac/scripts/build.sh
