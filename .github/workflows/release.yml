name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build and attach to (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  binaries:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-14
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: daemon

      - name: Build bandito
        working-directory: daemon
        run: cargo build --release --locked --bin bandito

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          cp daemon/target/release/bandito "$stage/bandito"
          cp LICENSE.md README.md "$stage/"
          mkdir -p dist
          asset="bandito-$TARGET.tar.gz"
          tar -C "$stage" -czf "dist/$asset" bandito LICENSE.md README.md
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" \
            "dist/bandito-${{ matrix.target }}.tar.gz" \
            "dist/bandito-${{ matrix.target }}.tar.gz.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  installer:
    name: install.sh
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Upload install.sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" scripts/install.sh --repo "$GITHUB_REPOSITORY" --clobber

  sign:
    name: SHA256SUMS
    needs: [binaries, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Collect checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir assets \
            --pattern 'bandito-*.tar.gz' --pattern 'install.sh'
          cd assets
          sha256sum bandito-*.tar.gz install.sh | sort -k2 > ../SHA256SUMS
          cat ../SHA256SUMS

      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::error::RELEASE_SIGNING_KEY is not set; run scripts/release-key.sh"
            exit 1
          fi
          umask 077
          key="$RUNNER_TEMP/release-key.pem"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_SIGNING_KEY" > "$key"
          openssl pkeyutl -sign -inkey "$key" -rawin -in SHA256SUMS -out SHA256SUMS.bin
          openssl pkey -in "$key" -pubout -out release.pub
          openssl pkeyutl -verify -pubin -inkey release.pub -rawin -in SHA256SUMS -sigfile SHA256SUMS.bin
          openssl base64 -A -in SHA256SUMS.bin -out SHA256SUMS.sig
          echo "Public key: $(sed -n 2p release.pub)"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" SHA256SUMS SHA256SUMS.sig --repo "$GITHUB_REPOSITORY" --clobber
