name: audit

# Known vulnerabilities (cargo audit) and the license and source policy (cargo deny, daemon/deny.toml) for the
# daemon's dependencies. Runs every day, so a new advisory is found even when nobody changed the code. ci.yml calls
# it when the dependencies change.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  workflow_call:

# A newer run for the same ref cancels the older one.
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: daemon

  cargo-deny:
    name: cargo deny
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny
      - name: Advisories, licenses, bans and sources
        run: cargo deny check
