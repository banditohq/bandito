version: 2
updates:
  # Rust crates of the daemon (daemon/Cargo.lock). Security updates are opened at once, outside this schedule.
  - package-ecosystem: cargo
    directory: /daemon
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # SwiftPM packages of the Mac app (apps/mac/BanditoKit/Package.resolved).
  - package-ecosystem: swift
    directory: /apps/mac/BanditoKit
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  # Actions used by .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
