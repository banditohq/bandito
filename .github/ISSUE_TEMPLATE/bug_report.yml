name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: {label: What happened?, description: What you did, what you expected, what you got.}
    validations: {required: true}
  - type: input
    id: version
    attributes: {label: Bandito version}
  - type: dropdown
    id: where
    attributes: {label: Where, multiple: true, options: [Daemon, Mac app, iPhone app, Docs, Website]}
  - type: textarea
    id: logs
    attributes: {label: Logs, render: shell}
