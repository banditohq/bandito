<!-- Фон DMG-установщика Bandito (без слов: язык строк не зависит от системы).
     Рендер (660x420 и @2x):
     "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --hide-scrollbars \
       --user-data-dir=<tmp> --force-device-scale-factor=1|2 --window-size=660,420 \
       --virtual-time-budget=4000 --screenshot=background[@2x].png file://<abs>/background.html
     Склейка: tiffutil -cathidpicheck background.png background@2x.png -out background.tiff -->
<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Onest:wght@400;500&display=block" rel="stylesheet">
<style>
html,body{margin:0;width:660px;height:420px;overflow:hidden;background:#12100E}
.c{position:relative;width:660px;height:420px;
 background:
  radial-gradient(420px 260px at 50% 46%, rgba(255,138,31,.13), rgba(255,138,31,0) 70%),
  radial-gradient(800px 500px at 50% 120%, #1A1714, #12100E 70%);}
.grain{position:absolute;inset:0;opacity:.18;background-image:radial-gradient(rgba(243,235,221,.35) .6px, transparent .7px);background-size:6px 6px;mask-image:radial-gradient(500px 300px at 50% 50%, #000 30%, transparent 80%)}
.top{position:absolute;left:0;right:0;top:34px;text-align:center}
.wm{font:700 22px/1 Unbounded;color:#F3EBDD;letter-spacing:-.2px}
.wm b{color:#FF8A1F}
.slot{position:absolute;top:150px;width:128px;height:128px;border-radius:30px;border:1.5px dashed rgba(243,235,221,.14)}
.s1{left:106px}.s2{left:426px}
.arrow{position:absolute;left:250px;top:196px;width:160px;height:36px}
.foot{position:absolute;left:0;right:0;top:336px;text-align:center;font:400 12px/1 Onest;color:#BDB2A0}
/* Light pills under the Finder labels («Bandito.app», «Applications») so the dark label text stays readable. */
.tag{position:absolute;top:284px;height:26px;border-radius:9px;background:rgba(243,235,221,.85)}
.t1{left:123px;width:94px}.t2{left:443px;width:95px}
</style></head><body><div class="c"><div class="grain"></div>
<div class="top"><div class="wm">Bandito<b>.</b></div></div>
<div class="slot s1"></div><div class="slot s2"></div>
<div class="tag t1"></div><div class="tag t2"></div>
<svg class="arrow" viewBox="0 0 160 36"><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#FF8A1F" stop-opacity=".15"/><stop offset="1" stop-color="#FF8A1F"/></linearGradient></defs>
<path d="M6 18 C 50 4, 100 4, 146 18" fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"/>
<path d="M136 9 L148 18 L136 27" fill="none" stroke="#FF8A1F" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
<div class="foot">bandito.dev</div>
</div></body></html>
