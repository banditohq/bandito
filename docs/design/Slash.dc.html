<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Bandito — слэш-команды</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A09}
a{color:#FFB067}a:hover{color:#FFD2A0}
button{font:inherit;cursor:pointer;transition:color .15s ease,box-shadow .2s ease,transform .12s ease,filter .15s ease}
button:hover{filter:brightness(1.15)}
@keyframes bnd-pop{from{opacity:0;transform:translateY(10px) scale(.98);transform-origin:bottom left}to{opacity:1;transform:none}}
@keyframes bnd-rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes bnd-caret{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes bnd-blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; display: flex; background: #12100E; color: #F3EBDD; font-family: Geist, -apple-system, sans-serif; font-size: 14px; overflow: hidden; position: relative;">
  <aside aria-hidden="true" style="width: 296px; flex-shrink: 0; background: linear-gradient(180deg, rgba(30,26,22,.92), rgba(22,19,17,.96)); border-right: 1px solid rgba(243,235,221,.07); opacity: .55;"></aside>
  <main style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: radial-gradient(900px 420px at 50% -120px, rgba(255,138,31,.07), transparent 70%), #12100E; position: relative;">
    <header style="height: 52px; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid rgba(243,235,221,.05);">
      <div style="display: flex; align-items: center; gap: 9px; padding: 5px 14px 5px 6px; border-radius: 999px; background: rgba(28,24,21,.8); border: 1px solid rgba(243,235,221,.09);">
        <svg width="26" height="26" viewBox="0 0 52 52"><rect width="52" height="52" rx="17" fill="#FFB067"></rect><path d="M8 22c6-6 30-6 36 0v7c-6 4-30 4-36 0z" fill="#12100E"></path><g style="transform-box: view-box; transform-origin: 26px 26px; animation: bnd-blink 5s ease-in-out infinite;"><path d="m16 23 4 3-4 3" stroke="#FFB067" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"></path><path d="M31 26h6" stroke="#FFB067" stroke-width="2.6" stroke-linecap="round"></path></g></svg>
        <span style="font-weight: 600;">Forge</span><span style="font-size: 11.5px; color: #867C6D;">Claude Code · Opus 5.5</span>
      </div>
    </header>
    <div style="flex: 1;"></div>

    <div role="listbox" aria-label="Команды" style="position: absolute; left: 50%; margin-left: -390px; bottom: 112px; width: 640px; border-radius: 18px; background: rgba(32,28,24,.98); border: 1px solid rgba(243,235,221,.12); box-shadow: 0 30px 80px -20px rgba(0,0,0,.9); overflow: hidden; animation: bnd-pop .2s cubic-bezier(.2,.9,.3,1.1) both;">
      <div style="display: flex; gap: 4px; padding: 8px 8px 0;">
        <sc-for list="{{filters}}" as="f" hint-placeholder-count="5"><button onClick="{{f.pick}}" style="{{f.style}}">{{f.label}} <span style="opacity: .6;">{{f.count}}</span></button></sc-for>
      </div>
      <div style="padding: 6px; display: flex; flex-direction: column; max-height: 420px;">
        <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
          <span style="font-size: 10.5px; font-weight: 600; letter-spacing: .08em; color: #6E655A; padding: 8px 10px 4px;">{{g.title}}</span>
          <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
            <div role="option" aria-selected="{{it.selAttr}}" style="{{it.row}}">
              <span style="{{it.iconWrap}}">{{it.glyph}}</span>
              <span style="font-family: 'Geist Mono', monospace; font-size: 13px; color: {{it.nameColor}};">/{{it.name}}</span>
              <span style="font-size: 12px; color: #6E655A; font-family: 'Geist Mono', monospace;">{{it.args}}</span>
              <span style="flex: 1; min-width: 0; font-size: 12.5px; color: #867C6D; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{it.desc}}</span>
              <span style="{{it.srcStyle}}">{{it.src}}</span>
            </div>
          </sc-for>
        </sc-for>
      </div>
      <div style="display: flex; gap: 14px; padding: 9px 14px; border-top: 1px solid rgba(243,235,221,.07); font-size: 11.5px; color: #6E655A; font-family: 'Geist Mono', monospace;">
        <span>↑↓ выбрать</span><span>↵ выполнить</span><span>⇥ подставить</span><span style="flex: 1;"></span><span style="font-family: Geist, sans-serif;">«с Mac» — установится на сервер при первом вызове</span>
      </div>
    </div>

    <div style="padding: 10px 0 18px; display: flex; flex-direction: column; align-items: center; gap: 8px;">
      <div style="width: 780px; border-radius: 24px; background: #1A1714; border: 1px solid rgba(255,138,31,.4); box-shadow: 0 0 0 4px rgba(255,138,31,.08), 0 20px 50px -24px rgba(0,0,0,.9); padding: 12px 12px 12px 16px; display: flex; align-items: center; gap: 10px;">
        <span style="font-family: 'Geist Mono', monospace; font-size: 14.5px; color: #FFB067;">/wo</span><span style="display: inline-block; width: 2px; height: 18px; background: #FF8A1F; animation: bnd-caret 1s infinite;"></span>
        <span style="flex: 1;"></span>
        <span style="width: 34px; height: 34px; border-radius: 50%; background: #F3EBDD; display: grid; place-items: center;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12100E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></span>
      </div>
      <div style="display: flex; gap: 14px; font-size: 11px; color: #5E564C; font-family: 'Geist Mono', monospace;"><span>/ команды</span><span>@ файлы</span><span>↵ отправить</span><span>⌘K поиск</span></div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { filter: 0 }; }
  renderVals() {
    const s = this.state;
    const fs = (on) => 'height: 26px; padding: 0 10px; border-radius: 8px; border: none; font-size: 12px; ' + (on ? 'background: #2C2722; color: #F3EBDD; font-weight: 600;' : 'background: transparent; color: #867C6D;');
    const filters = [['Все', 14], ['Сервер', 5], ['С Mac', 4], ['Bandito', 10], ['Мои', 2]].map(([label, count], k) => ({ label, count, style: fs(s.filter === k), pick: () => this.setState({ filter: k }) }));
    const src = (kind) => 'font-size: 10.5px; font-weight: 600; padding: 1px 7px; border-radius: 6px; ' + (kind === 'mac' ? 'color: #A3BDEB; background: rgba(163,189,235,.12);' : kind === 'server' ? 'color: #A9C7A2; background: rgba(169,199,162,.12);' : kind === 'mine' ? 'color: #C8B6E8; background: rgba(200,182,232,.12);' : 'color: #BDB2A0; background: rgba(243,235,221,.07);');
    const wrap = (c, bg) => 'width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 12px; flex-shrink: 0; color: ' + c + '; background: ' + bg + ';';
    let k = 0;
    const it = (name, args, desc, kind, glyph, sel) => {
      const n = k++;
      return { name, args, desc, glyph, src: kind === 'mac' ? 'с Mac' : kind === 'server' ? 'сервер' : kind === 'mine' ? 'мой' : 'Bandito', srcStyle: src(kind), selAttr: sel ? 'true' : 'false', nameColor: sel ? '#FFB067' : '#F3EBDD', iconWrap: kind === 'mac' ? wrap('#A3BDEB', 'rgba(163,189,235,.12)') : kind === 'server' ? wrap('#A9C7A2', 'rgba(169,199,162,.12)') : kind === 'mine' ? wrap('#C8B6E8', 'rgba(200,182,232,.12)') : wrap('#FFB067', 'rgba(255,138,31,.12)'), row: 'display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 10px; animation: bnd-rise .2s ease-out ' + (n * 30) + 'ms both; ' + (sel ? 'background: rgba(255,138,31,.10); box-shadow: inset 0 0 0 1px rgba(255,138,31,.3);' : '') };
    };
    const groups = [
      { title: 'СОВПАДЕНИЯ', items: [it('worklog', '[день]', 'Записать, что сделано сегодня, в журнал', 'mac', '⌘', true), it('workbot', '', 'Сводка по WorkBot', 'mac', '⌘')] },
      { title: 'СЕРВЕР · навыки Claude Code', items: [it('review-pr', '<номер>', 'Ревью pull request по чек-листу проекта', 'server', '✓'), it('deploy-staging', '', 'Выкатить на staging и проверить health', 'server', '↑')] },
      { title: 'BANDITO', items: [it('chapter', '', 'Новая глава: записать важное в память и начать с чистого листа', 'bandito', '§'), it('effort', 'high', 'Сменить усилие для следующих сообщений', 'bandito', '◐'), it('terminal', '', 'Открыть терминал в папке агента', 'bandito', '›')] },
      { title: 'МОИ СНИППЕТЫ', items: [it('standup', '', 'Что сделано вчера, что сегодня, что мешает', 'mine', '✎')] }
    ];
    return { filters, groups };
  }
}
</script>
</body>
</html>
